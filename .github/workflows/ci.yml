name: CI

on:
  push:
    branches: [main, DataIngestion]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: digilog
          POSTGRES_PASSWORD: digilog123
          POSTGRES_DB: digilog_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate --schema=packages/db/prisma/schema.prisma

      - name: Run database migrations
        run: npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://digilog:digilog123@localhost:5432/digilog_db

      - name: Build shared packages
        run: npx turbo run build --filter=@digilog/shared --filter=@digilog/db

      - name: Run tests
        run: npx turbo run test
        env:
          DATABASE_URL: postgresql://digilog:digilog123@localhost:5432/digilog_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          NODE_ENV: test
