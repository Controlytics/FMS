<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Static fallback only. The live tab title comes from Config -> Branding
         (`browserTitle`) and is applied by <DocumentBranding /> once
         /api/config/branding resolves. This literal is what shows before that
         fetch returns, and offline. Editing it needs `npx vite build` — the
         file is workbox-precached. -->
    <title>Filter Management System</title>

    <!-- PWA Meta -->
    <meta name="theme-color" content="#0891b2" />
    <meta name="description" content="DigiLog - 21 CFR Part 11 Compliant Digital Filter Management System" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DigiLog" />

    <!-- Icons. The favicon is operator-configurable (Config -> Branding ->
         Browser Tab); <DocumentBranding /> REPLACES this element at runtime
         when `faviconUrl` is set. Keep the id — the swap targets it. -->
    <link id="app-favicon" rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts (UI redesign 2026-10-01): IBM Plex Sans for everything, IBM Plex
         Mono for identifiers / timestamps / readings. SELF-HOSTED
         (public/fonts/plex/*.woff2 + plex.css) so the app renders identically
         with NO Internet access — it is deployed into air-gapped plants. Never
         add a CDN font link. app.css carries a system-font fallback. -->
    <link rel="stylesheet" href="/fonts/plex.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
