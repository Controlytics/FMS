services:
  # ─── PostgreSQL (Prisma — lifecycle data) ────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: digilog
      POSTGRES_USER: digilog_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-digilog_secret}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./apps/api/prisma/sql/extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digilog_app"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── TimescaleDB (time-series — separate instance) ──────────
  tsdb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5433:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./init-tsdb.sql:/docker-entrypoint-initdb.d/init-tsdb.sql
    environment:
      POSTGRES_DB: digilog_tsdb
      POSTGRES_USER: digilog_app
      POSTGRES_PASSWORD: ${TSDB_PASSWORD:-tsdb_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digilog_app"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Mosquitto MQTT Broker (replaces EMQX, Phase 1 of windows-friendly-rewrite) ──
  # Mosquitto 2.0+ uses its built-in dynamic-security plugin instead of EMQX's
  # HTTP webhook auth. The plugin reads ./dynamic-security.json which is
  # regenerated by POST /api/internal/mqtt/refresh-acl from the API.
  # See windowsIssues.md § 3 for rationale; mosquitto/mosquitto.conf for config.
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: digilog-mosquitto
    ports:
      - "1883:1883"       # MQTT
      # Uncomment for TLS (requires certs/ + edit mosquitto.conf):
      # - "8883:8883"     # MQTT/TLS
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # NOT :ro — the dynsec plugin writes back to this file when it
      # processes MQTT control commands. The API's /refresh-acl endpoint
      # also overwrites it atomically (tmp + rename).
      - ./mosquitto/dynamic-security.json:/mosquitto/config/dynamic-security.json
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  # ─── Redis (BullMQ + Pub/Sub) ──────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
  tsdb_data:
  mosquitto_data:
  mosquitto_log:
  redis_data:
