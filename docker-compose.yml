services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: digilog
      POSTGRES_USER: digilog
      POSTGRES_PASSWORD: ${DB_PASSWORD:-digilog_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/prisma/sql/extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digilog"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
