# mosquitto/mosquitto.linux.conf — DigiLog production config (Linux/Docker)
# Mosquitto 2.0+ with built-in dynamic-security plugin
# Generated dynamic-security.json comes from POST /api/internal/mqtt/refresh-acl
# (apps/api/src/transport/mosquitto-refresh-routes.ts).
#
# Windows uses mosquitto.windows.conf (same content, plugin extension .dll).
# Mosquitto's `plugin` directive does not auto-resolve the file extension, so
# the conf must match the host OS. Keep the two files in sync for any non-
# plugin-line change.

listener 1883
allow_anonymous false

# TLS listener (optional; uncomment + point to certs/)
# listener 8883
# certfile ../certs/server.crt
# keyfile ../certs/server.key
# cafile ../certs/rootCA.pem
# require_certificate false

# Persistence
persistence true
persistence_location ./data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice

# Dynamic security plugin (built-in since 2.0)
plugin mosquitto_dynamic_security.so
plugin_opt_config_file ./dynamic-security.json
